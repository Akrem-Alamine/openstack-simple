---
- name: Prepare all nodes
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    _openstack_release: "{{ openstack_release }}"
    timezone: "Africa/Tunis"  # Added to avoid undefined 'timezone' error (fallback from group_vars or override with -e)
  pre_tasks:
    - name: Show chosen OpenStack release
      debug:
        msg: "Using release {{ _openstack_release }}"
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - python3-pip
          - software-properties-common
          - curl
          - wget
        state: present

    - name: Ensure cloud keyring present
      apt:
        name: ubuntu-cloud-keyring
        state: present
        update_cache: yes

    - name: Add OpenStack repository (explicit deb line)
      apt_repository:
        repo: "deb http://ubuntu-cloud.archive.canonical.com/ubuntu {{ ansible_facts.lsb.codename }}-updates/{{ _openstack_release }} main"
        filename: "cloud-archive-{{ _openstack_release }}"
        state: present
        update_cache: yes

    - name: Apt update after adding cloud archive
      apt:
        update_cache: yes

    - name: Install OpenStack client
      apt:
        name: python3-openstackclient
        state: present

    - name: Set timezone
      timezone:
        name: "{{ timezone | default('Etc/UTC') }}"

    - name: Configure /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
        state: present
      loop: "{{ groups['openstack'] }}"

    - name: Disable firewall (for simplicity)
      ufw:
        state: disabled

    - name: Create openstack user
      user:
        name: openstack
        shell: /bin/bash
        create_home: yes
