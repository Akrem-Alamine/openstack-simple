---
- name: Install and configure PostgreSQL & RabbitMQ (controller only)
  hosts: controller
  become: true
  gather_facts: yes
  vars:
    postgres_admin_password: "ChangeMePostgresAdmin123"

  pre_tasks:
    - name: Install PostgreSQL server and dependencies
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Detect PostgreSQL major version directory
      shell: "ls -1 /etc/postgresql | grep -E '^[0-9]+$' | sort -nr | head -1"
      register: pg_version_dir
      changed_when: false

    - name: Set pg_hba_conf path dynamically
      set_fact:
        pg_hba_conf: "{{ '/etc/postgresql/' + (pg_version_dir.stdout | default('14')) + '/main/pg_hba.conf' }}"

  tasks:
    - name: Ensure postgres superuser password is set (first run, local peer auth)
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: postgres
        password: "ChangeMePostgresAdmin123"
        role_attr_flags: SUPERUSER

    - name: Adjust pg_hba.conf to md5 for IPv4 localhost
      lineinfile:
        path: "{{ pg_hba_conf }}"
        regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+'
        line: 'host    all             all             127.0.0.1/32            md5'
        backrefs: yes
      notify: Restart PostgreSQL

    - name: Adjust pg_hba.conf to md5 for IPv6 localhost
      lineinfile:
        path: "{{ pg_hba_conf }}"
        regexp: '^host\s+all\s+all\s+::1/128\s+'
        line: 'host    all             all             ::1/128                 md5'
        backrefs: yes
      notify: Restart PostgreSQL

    - name: Ensure PostgreSQL is started and enabled
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Wait for PostgreSQL to accept TCP connections
      wait_for:
        host: 127.0.0.1
        port: 5432
        delay: 2
        timeout: 30

    - name: Ensure service users (roles) exist
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        role_attr_flags: LOGIN
        state: present
        login_host: 127.0.0.1
        login_user: postgres
        login_password: "{{ postgres_admin_password }}"
      loop: "{{ openstack_db_users }}"
      no_log: true

    - name: Create OpenStack PostgreSQL databases with correct owners
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner }}"
        encoding: UTF8
        state: present
        login_host: 127.0.0.1
        login_user: postgres
        login_password: "{{ postgres_admin_password }}"
      loop: "{{ openstack_databases }}"

    - name: Install RabbitMQ server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes

    - name: Ensure RabbitMQ is started and enabled
      systemd:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Create RabbitMQ user for OpenStack
      community.rabbitmq.rabbitmq_user:
        user: openstack
        password: "{{ rabbit_password }}"
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        state: present
      no_log: true

  handlers:
    - name: Restart PostgreSQL
      systemd:
        name: postgresql
        state: restarted