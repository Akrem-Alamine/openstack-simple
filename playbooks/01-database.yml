---
- name: Install and configure OpenStack database (PostgreSQL) and RabbitMQ
  hosts: all
  become: true
  gather_facts: yes
  vars:
    controller_ip: "192.168.122.10"

    # Service DB user passwords (vault these in production)
    keystone_db_password: "ChangeMeKeystone123"
    glance_db_password:   "ChangeMeGlance123"
    nova_db_password:     "ChangeMeNova123"
    neutron_db_password:  "ChangeMeNeutron123"
    cinder_db_password:   "ChangeMeCinder123"

    rabbit_password: "ChangeMeRabbit123"
    postgres_admin_password: "ChangeMePostgresAdmin123"

    # List of OpenStack service DB users & passwords
    openstack_db_users:
      - { name: keystone, password: "{{ keystone_db_password }}" }
      - { name: glance,   password: "{{ glance_db_password }}" }
      - { name: nova,     password: "{{ nova_db_password }}" }
      - { name: neutron,  password: "{{ neutron_db_password }}" }
      - { name: cinder,   password: "{{ cinder_db_password }}" }

    # Databases to create (Nova needs extra DBs)
    openstack_databases:
      - { name: keystone,   owner: keystone }
      - { name: glance,     owner: glance }
      - { name: nova,       owner: nova }
      - { name: nova_api,   owner: nova }
      - { name: nova_cell0, owner: nova }
      - { name: neutron,    owner: neutron }
      - { name: cinder,     owner: cinder }

    # Allow override of pg_hba.conf path (auto-detected if empty)
    pg_hba_conf: ""

  pre_tasks:
    - name: Ensure Ansible remote tmp dir exists (avoid become_user chown issues)
      file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: '1777'

    - name: Install PostgreSQL server and dependencies
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Detect PostgreSQL major version directory
      shell: "ls -1 /etc/postgresql | grep -E '^[0-9]+$' | sort -nr | head -1"
      register: pg_version_dir
      changed_when: false

    - name: Set pg_hba_conf path dynamically (fallback to 14)
      set_fact:
        pg_hba_conf: "{{ '/etc/postgresql/' + (pg_version_dir.stdout | default('14')) + '/main/pg_hba.conf' }}"
      when: pg_hba_conf | length == 0

    - name: Ensure postgres superuser password is set (first run)
      command: >
        psql -U postgres -c "ALTER USER postgres WITH PASSWORD '{{ postgres_admin_password }}';"
      changed_when: false
      no_log: true

    - name: Ensure listen_addresses includes localhost
      lineinfile:
        path: "{{ pg_hba_conf | dirname }}/postgresql.conf"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = 'localhost'"
      notify: Restart PostgreSQL

  tasks:
    - name: Adjust pg_hba.conf to md5 for IPv4 localhost
      lineinfile:
        path: "{{ pg_hba_conf }}"
        regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+'
        line: 'host    all             all             127.0.0.1/32            md5'
        backrefs: yes
      notify: Restart PostgreSQL

    - name: Adjust pg_hba.conf to md5 for IPv6 localhost
      lineinfile:
        path: "{{ pg_hba_conf }}"
        regexp: '^host\s+all\s+all\s+::1/128\s+'
        line: 'host    all             all             ::1/128                 md5'
        backrefs: yes
      notify: Restart PostgreSQL

    - name: Ensure PostgreSQL is started and enabled
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Wait for PostgreSQL to accept TCP connections
      wait_for:
        host: 127.0.0.1
        port: 5432
        delay: 1
        timeout: 30

    - name: Ensure service users (roles) exist
      postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        role_attr_flags: LOGIN
        state: present
        login_host: 127.0.0.1
        login_user: postgres
        login_password: "{{ postgres_admin_password }}"
      loop: "{{ openstack_db_users }}"
      no_log: true

    - name: Create OpenStack PostgreSQL databases with correct owners
      postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner }}"
        encoding: UTF8
        state: present
        login_host: 127.0.0.1
        login_user: postgres
        login_password: "{{ postgres_admin_password }}"
      loop: "{{ openstack_databases }}"

    - name: Install RabbitMQ server
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes

    - name: Ensure RabbitMQ is started and enabled
      systemd:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: Create RabbitMQ user for OpenStack
      rabbitmq_user:
        user: openstack
        password: "{{ rabbit_password }}"
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        state: present
      no_log: true

  handlers:
    - name: Restart PostgreSQL
      systemd:
        name: postgresql
        state: restarted