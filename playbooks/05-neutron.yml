---
- name: Install and configure Neutron (Controller)
  hosts: controller
  become: yes
  vars:
    neutron_user_created: /tmp/neutron_user_created
    neutron_service_created: /tmp/neutron_service_created
    neutron_endpoints_created: /tmp/neutron_endpoints_created

  tasks:
    - name: Install Neutron packages
      apt:
        name:
          - neutron-server
          - neutron-plugin-ml2
          - neutron-linuxbridge-agent
          - neutron-dhcp-agent
          - neutron-metadata-agent
        state: present
        update_cache: yes

    - name: Create neutron user
      shell: |
        . /root/admin-openrc
        openstack user show neutron || openstack user create --domain default --password {{ neutron_password }} neutron
      args:
        executable: /bin/bash

    - name: Add admin role to neutron user
      shell: |
        . /root/admin-openrc
        openstack role assignment list --project service --user neutron | grep admin || \
        openstack role add --project service --user neutron admin
      args:
        executable: /bin/bash

    - name: Create neutron service
      shell: |
        . /root/admin-openrc
        openstack service create --name neutron --description "OpenStack Networking" network
      args:
        creates: "{{ neutron_service_created }}"
        executable: /bin/bash

    - name: Create neutron endpoints
      shell: |
        source /root/admin-openrc
        # Get the neutron service ID (pick the first one if multiple exist)
        SERVICE_ID=$(openstack service list -f value -c ID -c Name | awk '$2=="neutron"{print $1; exit}')

        # Create endpoints only if they do not already exist
        openstack endpoint show $SERVICE_ID public  || openstack endpoint create --region RegionOne $SERVICE_ID public  http://{{ controller_ip }}:9696
        openstack endpoint show $SERVICE_ID internal || openstack endpoint create --region RegionOne $SERVICE_ID internal http://{{ controller_ip }}:9696
        openstack endpoint show $SERVICE_ID admin    || openstack endpoint create --region RegionOne $SERVICE_ID admin    http://{{ controller_ip }}:9696
      args:
        executable: /bin/bash



    - name: Configure Neutron database
      ini_file:
        path: /etc/neutron/neutron.conf
        section: database
        option: connection
        value: "{{ neutron_database_connection }}"
        backup: yes

    - name: Configure Neutron default settings
      ini_file:
        path: /etc/neutron/neutron.conf
        section: DEFAULT
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "core_plugin", value: "ml2" }
        - { option: "service_plugins", value: "router" }
        - { option: "transport_url", value: "{{ transport_url }}" }
        - { option: "auth_strategy", value: "keystone" }
        - { option: "notify_nova_on_port_status_changes", value: "true" }
        - { option: "notify_nova_on_port_data_changes", value: "true" }

    - name: Configure Neutron Keystone authentication
      ini_file:
        path: /etc/neutron/neutron.conf
        section: keystone_authtoken
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "www_authenticate_uri", value: "http://{{ controller_ip }}:5000" }
        - { option: "auth_url", value: "http://{{ controller_ip }}:5000" }
        - { option: "memcached_servers", value: "{{ controller_ip }}:11211" }
        - { option: "auth_type", value: "password" }
        - { option: "project_domain_name", value: "Default" }
        - { option: "user_domain_name", value: "Default" }
        - { option: "project_name", value: "service" }
        - { option: "username", value: "neutron" }
        - { option: "password", value: "{{ neutron_password }}" }

    - name: Configure ML2 plugin
      ini_file:
        path: /etc/neutron/plugins/ml2/ml2_conf.ini
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { section: "ml2", option: "type_drivers", value: "flat,vlan,vxlan" }
        - { section: "ml2", option: "tenant_network_types", value: "vxlan" }
        - { section: "ml2", option: "mechanism_drivers", value: "linuxbridge" }
        - { section: "ml2", option: "extension_drivers", value: "port_security" }
        - { section: "ml2_type_flat", option: "flat_networks", value: "provider" }
        - { section: "ml2_type_vxlan", option: "vni_ranges", value: "1:1000" }

    - name: Configure Linux bridge agent
      ini_file:
        path: /etc/neutron/plugins/ml2/linuxbridge_agent.ini
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { section: "linux_bridge", option: "physical_interface_mappings", value: "provider:{{ provider_interface }}" }
        - { section: "vxlan", option: "enable_vxlan", value: "true" }
        - { section: "vxlan", option: "local_ip", value: "{{ controller_ip }}" }
        - { section: "securitygroup", option: "enable_security_group", value: "true" }
        - { section: "securitygroup", option: "firewall_driver", value: "neutron.agent.linux.iptables_firewall.IptablesFirewallDriver" }

    - name: Populate Neutron database
      shell: neutron-db-manage --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/plugins/ml2/ml2_conf.ini upgrade head
      become_user: neutron

    - name: Start and enable Neutron services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - neutron-server
        - neutron-linuxbridge-agent
        - neutron-dhcp-agent
        - neutron-metadata-agent

    - name: Mark neutron tasks as created
      file:
        path: "{{ item }}"
        state: touch
        mode: '0644'
      loop:
        - "{{ neutron_user_created }}"
        - "{{ neutron_service_created }}"
        - "{{ neutron_endpoints_created }}"

- name: Install and configure Neutron (Compute)
  hosts: compute
  become: yes
  tasks:
    - name: Install Neutron Linux bridge agent
      apt:
        name: neutron-linuxbridge-agent
        state: present
        update_cache: yes

    - name: Configure Neutron agent
      ini_file:
        path: /etc/neutron/neutron.conf
        section: DEFAULT
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "transport_url", value: "{{ transport_url }}" }
        - { option: "auth_strategy", value: "keystone" }

    - name: Configure Linux bridge agent on compute
      ini_file:
        path: /etc/neutron/plugins/ml2/linuxbridge_agent.ini
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { section: "linux_bridge", option: "physical_interface_mappings", value: "provider:{{ provider_interface }}" }
        - { section: "vxlan", option: "enable_vxlan", value: "true" }
        - { section: "vxlan", option: "local_ip", value: "{{ compute_ip }}" }
        - { section: "securitygroup", option: "enable_security_group", value: "true" }
        - { section: "securitygroup", option: "firewall_driver", value: "neutron.agent.linux.iptables_firewall.IptablesFirewallDriver" }

    - name: Start and enable Neutron Linux bridge agent
      systemd:
        name: neutron-linuxbridge-agent
        state: started
        enabled: yes
