---
- name: Install and configure Cinder (Controller)
  hosts: controller
  become: yes
  vars:
    cinder_database_connection: "mysql+pymysql://cinder:{{ cinder_db_password }}@{{ controller_ip }}/cinder"
  tasks:
    - name: Install Cinder packages
      apt:
        name:
          - cinder-api
          - cinder-scheduler
        state: present
        update_cache: yes

    - name: Create Cinder user (if not exists)
      shell: |
        source /root/admin-openrc
        openstack user show cinder >/dev/null 2>&1 || \
        openstack user create --domain default --password {{ cinder_password }} cinder
      args:
        executable: /bin/bash

    - name: Add admin role to Cinder user (if not already added)
      shell: |
        source /root/admin-openrc
        openstack role assignment list --project service --user cinder | grep admin >/dev/null 2>&1 || \
        openstack role add --project service --user cinder admin
      args:
        executable: /bin/bash

    - name: Create Cinder services (if not exist)
      shell: |
        source /root/admin-openrc
        openstack service show cinderv2 >/dev/null 2>&1 || \
        openstack service create --name cinderv2 --description "OpenStack Block Storage" volumev2
        openstack service show cinderv3 >/dev/null 2>&1 || \
        openstack service create --name cinderv3 --description "OpenStack Block Storage" volumev3
      args:
        executable: /bin/bash

    - name: Create Cinder endpoints (if not exist)
      shell: |
        source /root/admin-openrc
        V2_ID=$(openstack service list -f value -c ID -c Name | awk '$2=="cinderv2"{print $1}')
        V3_ID=$(openstack service list -f value -c ID -c Name | awk '$2=="cinderv3"{print $1}')

        openstack endpoint show $V2_ID public >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V2_ID public 'http://{{ controller_ip }}:8776/v2/%(project_id)s'
        openstack endpoint show $V2_ID internal >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V2_ID internal 'http://{{ controller_ip }}:8776/v2/%(project_id)s'
        openstack endpoint show $V2_ID admin >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V2_ID admin 'http://{{ controller_ip }}:8776/v2/%(project_id)s'

        openstack endpoint show $V3_ID public >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V3_ID public 'http://{{ controller_ip }}:8776/v3/%(project_id)s'
        openstack endpoint show $V3_ID internal >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V3_ID internal 'http://{{ controller_ip }}:8776/v3/%(project_id)s'
        openstack endpoint show $V3_ID admin >/dev/null 2>&1 || \
          openstack endpoint create --region RegionOne $V3_ID admin 'http://{{ controller_ip }}:8776/v3/%(project_id)s'
      args:
        executable: /bin/bash


    - name: Configure Cinder database
      ini_file:
        path: /etc/cinder/cinder.conf
        section: database
        option: connection
        value: "{{ cinder_database_connection }}"
        backup: yes

    - name: Configure Cinder default settings
      ini_file:
        path: /etc/cinder/cinder.conf
        section: DEFAULT
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "transport_url", value: "{{ transport_url }}" }
        - { option: "auth_strategy", value: "keystone" }
        - { option: "my_ip", value: "{{ controller_ip }}" }

    - name: Configure Cinder Keystone authentication
      ini_file:
        path: /etc/cinder/cinder.conf
        section: keystone_authtoken
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "www_authenticate_uri", value: "http://{{ controller_ip }}:5000" }
        - { option: "auth_url", value: "http://{{ controller_ip }}:5000" }
        - { option: "memcached_servers", value: "{{ controller_ip }}:11211" }
        - { option: "auth_type", value: "password" }
        - { option: "project_domain_name", value: "Default" }
        - { option: "user_domain_name", value: "Default" }
        - { option: "project_name", value: "service" }
        - { option: "username", value: "cinder" }
        - { option: "password", value: "{{ cinder_password }}" }

    - name: Populate Cinder database
      shell: cinder-manage db sync
      become_user: cinder

    - name: Start and enable Cinder services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - cinder-scheduler
        - cinder-api
        - apache2
      when: ansible_facts.packages['cinder-api'] is defined

- name: Install and configure Cinder Volume (Storage)
  hosts: storage
  become: yes
  tasks:
    - name: Install Cinder Volume and LVM packages
      apt:
        name:
          - cinder-volume
          - lvm2
          - thin-provisioning-tools
          - tgt
        state: present
        update_cache: yes

    - name: Create physical volume (if not exists)
      shell: |
        pvdisplay {{ volume_device }} >/dev/null 2>&1 || pvcreate {{ volume_device }}
      args:
        executable: /bin/bash

    - name: Create volume group (if not exists)
      shell: |
        vgdisplay {{ volume_group }} >/dev/null 2>&1 || vgcreate {{ volume_group }} {{ volume_device }}
      args:
        executable: /bin/bash

    - name: Configure Cinder Volume database
      ini_file:
        path: /etc/cinder/cinder.conf
        section: database
        option: connection
        value: "{{ cinder_database_connection }}"
        backup: yes

    - name: Configure Cinder Volume default settings
      ini_file:
        path: /etc/cinder/cinder.conf
        section: DEFAULT
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "transport_url", value: "{{ transport_url }}" }
        - { option: "auth_strategy", value: "keystone" }
        - { option: "my_ip", value: "{{ storage_ip }}" }
        - { option: "enabled_backends", value: "lvm" }
        - { option: "glance_api_servers", value: "http://{{ controller_ip }}:9292" }

    - name: Configure Cinder Volume Keystone authentication
      ini_file:
        path: /etc/cinder/cinder.conf
        section: keystone_authtoken
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "www_authenticate_uri", value: "http://{{ controller_ip }}:5000" }
        - { option: "auth_url", value: "http://{{ controller_ip }}:5000" }
        - { option: "memcached_servers", value: "{{ controller_ip }}:11211" }
        - { option: "auth_type", value: "password" }
        - { option: "project_domain_name", value: "Default" }
        - { option: "user_domain_name", value: "Default" }
        - { option: "project_name", value: "service" }
        - { option: "username", value: "cinder" }
        - { option: "password", value: "{{ cinder_password }}" }

    - name: Configure LVM backend
      ini_file:
        path: /etc/cinder/cinder.conf
        section: lvm
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "volume_driver", value: "cinder.volume.drivers.lvm.LVMVolumeDriver" }
        - { option: "volume_group", value: "{{ volume_group }}" }
        - { option: "target_protocol", value: "iscsi" }
        - { option: "target_helper", value: "tgtadm" }

    - name: Start and enable Cinder Volume
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - tgt
        - cinder-volume
