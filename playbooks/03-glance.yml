---
- name: Install and configure Glance
  hosts: controller
  become: yes
  tasks:
    - name: Install Glance
      apt:
        name: glance
        state: present
    - name: Check if glance user exists
      shell: |
        . /root/admin-openrc
        openstack user show glance
      args:
        executable: /bin/bash
      register: glance_user
      ignore_errors: true

    - name: Create glance user
      shell: |
        . /root/admin-openrc
        openstack user create --domain default --password {{ glance_password }} glance
      args:
        executable: /bin/bash
      when: glance_user.rc != 0

    - name: Add admin role to glance user
      openstack.cloud.role_assignment:
        user: glance
        role: admin
        project: service
        state: present
      environment:
        OS_AUTH_URL: "http://controller:5000/v3"
        OS_USERNAME: "admin"
        OS_PASSWORD: "{{ admin_password }}"
        OS_PROJECT_NAME: "admin"
        OS_USER_DOMAIN_NAME: "Default"
        OS_PROJECT_DOMAIN_NAME: "Default"

    - name: Create glance service
      shell: |
        . /root/admin-openrc
        openstack service create --name glance --description "OpenStack Image" image
        touch /tmp/glance_service_created
      args:
        creates: /tmp/glance_service_created
        executable: /bin/bash

    - name: Create glance endpoints
      shell: |
        . /root/admin-openrc
        openstack endpoint create --region RegionOne image public http://{{ controller_ip }}:9292
        openstack endpoint create --region RegionOne image internal http://{{ controller_ip }}:9292
        openstack endpoint create --region RegionOne image admin http://{{ controller_ip }}:9292
        touch /tmp/glance_endpoints_created
      args:
        creates: /tmp/glance_endpoints_created
        executable: /bin/bash

    - name: Configure Glance API database
      ini_file:
        path: /etc/glance/glance-api.conf
        section: database
        option: connection
        value: "{{ glance_database_connection }}"
        backup: yes

    - name: Configure Glance API keystone authentication
      ini_file:
        path: /etc/glance/glance-api.conf
        section: keystone_authtoken
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "www_authenticate_uri", value: "http://{{ controller_ip }}:5000" }
        - { option: "auth_url", value: "http://{{ controller_ip }}:5000" }
        - { option: "memcached_servers", value: "{{ controller_ip }}:11211" }
        - { option: "auth_type", value: "password" }
        - { option: "project_domain_name", value: "Default" }
        - { option: "user_domain_name", value: "Default" }
        - { option: "project_name", value: "service" }
        - { option: "username", value: "glance" }
        - { option: "password", value: "{{ glance_password }}" }

    - name: Configure Glance API paste_deploy
      ini_file:
        path: /etc/glance/glance-api.conf
        section: paste_deploy
        option: flavor
        value: keystone

    - name: Configure Glance API glance_store
      ini_file:
        path: /etc/glance/glance-api.conf
        section: glance_store
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { option: "stores", value: "file,http" }
        - { option: "default_store", value: "file" }
        - { option: "filesystem_store_datadir", value: "/var/lib/glance/images/" }

    - name: Populate Glance database (with retries)
      command: glance-manage db_sync
      become_user: glance
      register: db_sync_result
      retries: 3
      delay: 10
      until: db_sync_result.rc == 0
      changed_when: db_sync_result.rc == 0
      failed_when: db_sync_result.rc != 0

    - name: Start and enable Glance API
      systemd:
        name: glance-api
        state: started
        enabled: yes

    - name: Mark services as created
      file:
        path: "{{ item }}"
        state: touch
        mode: '0644'
      loop:
        - /tmp/glance_user_created
        - /tmp/glance_service_created
        - /tmp/glance_endpoints_created
