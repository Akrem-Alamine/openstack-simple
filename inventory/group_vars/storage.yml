# Storage node specific variables
services_to_install:
  - cinder-volume
  - lvm2
  - thin-provisioning-tools

# Cinder configuration (PostgreSQL)
cinder_database_connection: "postgresql+psycopg2://cinder:{{ cinder_db_password }}@{{ controller_ip }}/cinder"

# LVM configuration
volume_group: "cinder-volumes"
volume_device: "/dev/vdb"  # Matches attached cinder-volumes disk (see setup instructions)
