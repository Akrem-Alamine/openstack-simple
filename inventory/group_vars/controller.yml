# Controller node specific variables
# Switched from MySQL to PostgreSQL
services_to_install:
  - postgresql
  - postgresql-contrib
  - rabbitmq-server
  - keystone
  - glance
  - nova-api
  - nova-conductor
  - nova-scheduler
  - neutron-server
  - neutron-plugin-ml2
  - horizon

# PostgreSQL uses peer auth for local 'postgres' superuser; no root password variable needed.

# Keystone configuration
keystone_database_connection: "postgresql+psycopg2://keystone:{{ keystone_db_password }}@{{ controller_ip }}/keystone"

# Glance configuration
glance_database_connection: "postgresql+psycopg2://glance:{{ glance_db_password }}@{{ controller_ip }}/glance"

# Nova configuration
nova_database_connection: "postgresql+psycopg2://nova:{{ nova_db_password }}@{{ controller_ip }}/nova"
nova_api_database_connection: "postgresql+psycopg2://nova:{{ nova_db_password }}@{{ controller_ip }}/nova_api"
nova_cell0_database_connection: "postgresql+psycopg2://nova:{{ nova_db_password }}@{{ controller_ip }}/nova_cell0"

# Neutron configuration
neutron_database_connection: "postgresql+psycopg2://neutron:{{ neutron_db_password }}@{{ controller_ip }}/neutron"
